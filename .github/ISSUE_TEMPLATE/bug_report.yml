name: Bug report
description: Report a reproducible problem in Volta.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove serial numbers, account details, credentials, and personal data from screenshots or logs before sharing.
  - type: input
    id: version
    attributes:
      label: Volta version
      description: Find this under Settings → About.
      placeholder: 2.2.0 (build 27)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Attach only reviewed, redacted screenshots. Never include credentials or unredacted system logs.
    validations:
      required: false
