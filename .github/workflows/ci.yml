name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Swift tests and universal app build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Swift tests
        shell: bash
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          swift --version
          swift test

      - name: Build universal app and local packages
        shell: bash
        run: |
          export DEVELOPER_DIR="$(xcode-select -p)"
          ./Scripts/build-app.sh
